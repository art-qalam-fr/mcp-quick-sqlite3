name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "15 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Sensitive data detection (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Scan for secrets
        run: gitleaks git --redact --verbose .

  antivirus:
    name: Antivirus scan (ClamAV)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav
      - name: Update virus signatures
        run: |
          sudo systemctl stop clamav-freshclam 2>/dev/null || true
          sudo freshclam
      - name: Scan repository
        run: clamscan --recursive --infected --exclude-dir='\.git' .

  osv-scan:
    name: Dependency malware & vulns (OSV-Scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Install OSV-Scanner
        run: |
          curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o /tmp/osv-scanner
          chmod +x /tmp/osv-scanner
      - name: Scan dependencies (vulns + malicious packages)
        run: /tmp/osv-scanner scan --recursive --skip-git --format=table .
